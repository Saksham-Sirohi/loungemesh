<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoungeMesh – Updating</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      padding: 40px 32px;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .spinner-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 9999px;
      font-size: 12px;
      color: #60a5fa;
      font-weight: 500;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #3b82f6;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    .reload-btn {
      margin-top: 10px;
      border: none;
      background: #3b82f6;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .reload-btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    .reload-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner-ring" aria-hidden="true"></div>
    <h1>Updating LoungeMesh</h1>
    <p>We're deploying updates to the service. This usually takes less than 2 minutes. We'll automatically bring you back once it's ready.</p>
    <div class="status-pill">
      <div class="pulse-dot"></div>
      <span id="status-text">Checking for service…</span>
    </div>
    <button type="button" class="reload-btn" onclick="window.location.reload()">Reload Now</button>
  </div>

  <script>
    (function() {
      var checkInterval = 5000;
      var statusEl = document.getElementById('status-text');

      function checkHealth() {
        fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
          .then(function(res) {
            if (res.status === 200) {
              if (statusEl) statusEl.textContent = 'Service back online! Reconnecting…';
              window.location.reload();
            }
          })
          .catch(function() {
            // Still unreachable, wait for next tick
          });
      }

      setInterval(checkHealth, checkInterval);
    })();
  </script>
</body>
</html>
